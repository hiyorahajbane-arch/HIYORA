<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIYORA - Jeans Ad</title>
<style>
  body{margin:0;background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family: sans-serif;}
  .ad{width:1080px;height:1080px;background:#fff;display:flex;overflow:hidden;position:relative}
  .right{flex:1;background:#0f0f0f;color:#fff;padding:50px;display:flex;flex-direction:column;justify-content:center}
  .left{flex:1;background:url('https://images.unsplash.com/photo-1542272604-787c3835535d?q=80&w=800') center/cover}
  .badge{background:#ff3b30;color:#fff;padding:10px 20px;display:inline-block;font-weight:900;font-size:22px;border-radius:8px;width:fit-content}
  h1{font-size:62px;margin:20px 0 10px;line-height:1;font-weight:900}
  h1 span{color:#ff3b30}
  .subtitle{font-size:28px;opacity:0.8;margin-bottom:30px}
  .features{background:#1a1a1a;border-radius:16px;padding:20px;margin:20px 0}
  .features div{font-size:22px;margin:8px 0}
  .price{display:flex;align-items:center;gap:15px;margin-top:20px}
  .price .new{font-size:58px;font-weight:900;color:#ff3b30}
  .price .old{font-size:32px;text-decoration:line-through;opacity:0.6}
  .cta{background:#ff3b30;color:#fff;text-align:center;padding:18px;border-radius:50px;font-size:26px;font-weight:900;margin-top:25px}
  .site{margin-top:15px;text-align:center;font-size:20px;letter-spacing:1px;opacity:0.7}
</style>
</head>
<body>
  <div class="ad">
    <div class="right">
      <div class="badge">🔥 الأكثر مبيعاً</div>
      <h1>سروال<br><span>دجين</span><br>للرجال</h1>
      <div class="subtitle">أناقة + راحة طوال اليوم</div>
      <div class="features">
        <div>✓ دجين أصلي ما كيحبب ما كيبهات</div>
        <div>✓ جميع المقاسات 30 إلى 44</div>
        <div>✓ coupe slim / regular</div>
      </div>
      <div class="price">
        <div class="new">250 DH</div>
        <div class="old">349 DH</div>
      </div>
      <div class="cta">اطلب الآن بـ 250 درهم فقط</div>
      <div class="site">HIYORA FASHION | hiyora.vercel.app</div>
    </div>
    <div class="left"></div>
  </div>
</body>
</html>
